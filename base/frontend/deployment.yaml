apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/baha0x13/ticket-sale-frontend:dad26c6c803ae809cf8996e76d93c8458d96d4fa
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: API_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: API_GATEWAY_URL
            - name: API_GATEWAY_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: API_GATEWAY_PORT
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10