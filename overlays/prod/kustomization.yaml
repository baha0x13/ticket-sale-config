apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: app-config
    namespace: app
    behavior: merge
    literals:
      - DB_PORT=3307
      - API_GATEWAY_URL=http://api.ticketflow.local

patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: ticketflow
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: ticketflow.local
      - op: replace
        path: /spec/rules/1/host
        value: api.ticketflow.local