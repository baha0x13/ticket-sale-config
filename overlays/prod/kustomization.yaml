apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/baha0x13/ticket-sale-api-service
    newTag: 6e29fd5bf5466eb03d1a2a2a13a917531f0c00f6
  - name: ghcr.io/baha0x13/ticket-sale-auth-service
    newTag: 6e29fd5bf5466eb03d1a2a2a13a917531f0c00f6
  - name: ghcr.io/baha0x13/ticket-sale-movie-service
    newTag: 6e29fd5bf5466eb03d1a2a2a13a917531f0c00f6
  - name: ghcr.io/baha0x13/ticket-sale-notifications-service
    newTag: 6e29fd5bf5466eb03d1a2a2a13a917531f0c00f6
  - name: ghcr.io/baha0x13/ticket-sale-frontend
    newTag: 6e29fd5bf5466eb03d1a2a2a13a917531f0c00f6

configMapGenerator:
  - name: app-config
    namespace: app
    behavior: merge
    literals:
      - DB_PORT=3307
      - API_GATEWAY_URL=http://api.ticket-sale.local

patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: ticket-sale
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: ticket-sale.local
      - op: replace
        path: /spec/rules/1/host
        value: api.ticket-sale.local