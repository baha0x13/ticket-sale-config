apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-postgres-exporter
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  postgres-exporter-overview.json: |
    {
      "title": "Ticket Sale - Postgres (Supabase)",
      "uid": "ticket-sale-postgres",
      "timezone": "utc",
      "schemaVersion": 39,
      "version": 1,
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Up",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "targets": [
            { "expr": "pg_up{job=\"postgres-exporter\"}", "legendFormat": "up", "datasource": { "type": "prometheus", "uid": "prometheus" } }
          ]
        },
        {
          "id": 2,
          "title": "Active Backends",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 18, "x": 6, "y": 0 },
          "targets": [
            { "expr": "pg_stat_database_numbackends{job=\"postgres-exporter\", datname!=\"\"}", "legendFormat": "{{datname}}", "datasource": { "type": "prometheus", "uid": "prometheus" } }
          ]
        },
        {
          "id": 3,
          "title": "Transactions per Second",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            { "expr": "rate(pg_stat_database_xact_commit{job=\"postgres-exporter\", datname!=\"\"}[5m])", "legendFormat": "commit {{datname}}", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "expr": "rate(pg_stat_database_xact_rollback{job=\"postgres-exporter\", datname!=\"\"}[5m])", "legendFormat": "rollback {{datname}}", "datasource": { "type": "prometheus", "uid": "prometheus" } }
          ]
        },
        {
          "id": 4,
          "title": "Cache Hit Ratio",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1, "min": 0 }, "overrides": [] },
          "targets": [
            { "expr": "sum(rate(pg_stat_database_blks_hit{job=\"postgres-exporter\", datname!=\"\"}[5m])) by (datname) / (sum(rate(pg_stat_database_blks_hit{job=\"postgres-exporter\", datname!=\"\"}[5m])) by (datname) + sum(rate(pg_stat_database_blks_read{job=\"postgres-exporter\", datname!=\"\"}[5m])) by (datname))", "legendFormat": "{{datname}}", "datasource": { "type": "prometheus", "uid": "prometheus" } }
          ]
        },
        {
          "id": 5,
          "title": "Database Size",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            { "expr": "pg_database_size_bytes{job=\"postgres-exporter\", datname!=\"\"}", "legendFormat": "{{datname}}", "datasource": { "type": "prometheus", "uid": "prometheus" } }
          ]
        },
        {
          "id": 6,
          "title": "Row Activity (insert/update/delete)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [
            { "expr": "rate(pg_stat_database_tup_inserted{job=\"postgres-exporter\", datname!=\"\"}[5m])", "legendFormat": "insert {{datname}}", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "expr": "rate(pg_stat_database_tup_updated{job=\"postgres-exporter\", datname!=\"\"}[5m])", "legendFormat": "update {{datname}}", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "expr": "rate(pg_stat_database_tup_deleted{job=\"postgres-exporter\", datname!=\"\"}[5m])", "legendFormat": "delete {{datname}}", "datasource": { "type": "prometheus", "uid": "prometheus" } }
          ]
        },
        {
          "id": 7,
          "title": "Deadlocks",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "targets": [
            { "expr": "rate(pg_stat_database_deadlocks{job=\"postgres-exporter\", datname!=\"\"}[5m])", "legendFormat": "{{datname}}", "datasource": { "type": "prometheus", "uid": "prometheus" } }
          ]
        },
        {
          "id": 8,
          "title": "Exporter Scrape Duration",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            { "expr": "pg_exporter_last_scrape_duration_seconds{job=\"postgres-exporter\"}", "legendFormat": "scrape duration", "datasource": { "type": "prometheus", "uid": "prometheus" } }
          ]
        }
      ]
    }

