apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notifications-service
  template:
    metadata:
      labels:
        app: notifications-service
    spec:
      containers:
        - name: notifications-service
          image: ghcr.io/baha0x13/ticket-sale-notifications-service:dad26c6c803ae809cf8996e76d93c8458d96d4fa
          ports:
            - containerPort: 3001
              name: actuator
          env:
            - name: AMQP_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AMQP_URL
            - name: NOTIFICATIONS_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NOTIFICATIONS_QUEUE
          livenessProbe:
            httpGet:
              path: /healthz
              port: actuator
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: actuator
            initialDelaySeconds: 5
            periodSeconds: 10