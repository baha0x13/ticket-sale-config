apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              export DATA_SOURCE_NAME="postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&keepalives=1&keepalives_idle=30&keepalives_interval=10&keepalives_count=3"
              exec /bin/postgres_exporter
          envFrom:
            - secretRef:
                name: postgres-exporter-secret
          ports:
            - containerPort: 9187
              name: metrics
